<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenPath</title>
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body class="op-overlay-body">
  <div id="op-root"></div>
  <script type="module">
    import { startOverlay } from "./js/app.js";
    // window.openpath lets teammates (and tests) drive the overlay from DevTools:
    // openpath.handleQuery("how do i add a new tab to google docs")
    startOverlay(document.getElementById("op-root")).then((api) => { window.openpath = api; });
  </script>
</body>
</html>
