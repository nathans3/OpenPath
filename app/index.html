<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>OpenPath</title>
  <meta name="description" content="OpenPath web preview: the floating voice assistant for seniors, running over practice screens.">
  <link rel="stylesheet" href="css/lab.css">
  <link rel="stylesheet" href="css/overlay.css">
  <style>
    /* Web preview: the Test Lab is the "desktop" and the overlay floats above it. */
    html, body { height: 100%; }
    body.lab-body { margin: 0; overflow: auto; }
    .web-banner { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--lab-rail); border-bottom: 1px solid var(--lab-line); font-size: 14px; color: var(--lab-ink-2); font-family: var(--lab-font); }
    .web-banner b { color: var(--lab-ink); font-family: var(--lab-display); font-size: 16px; }
    .web-banner a { color: var(--lab-accent); font-weight: 700; }
    .web-banner .orb { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 210deg, #5fd3c4, #6f8cff, #5fd3c4); box-shadow: 0 0 12px rgba(95,211,196,.6); }
    #lab { min-height: calc(100% - 44px); }
  </style>
</head>
<body class="lab-body">
  <div class="web-banner"><span class="orb"></span><b>OpenPath</b><span>Web preview of the desktop app. The glowing circle floats over these practice screens the way it floats over real apps on a Mac or PC.</span><a href="https://github.com/nathans3/OpenPath" target="_blank" rel="noopener">Code and desktop download on GitHub</a></div>
  <div id="lab"></div>
  <div id="op-root"></div>
  <script type="module">
    import { mountLab } from "./js/lab.js";
    import { startOverlay } from "./js/app.js";
    mountLab(document.getElementById("lab"), { embedded: true });
    startOverlay(document.getElementById("op-root"));
  </script>
</body>
</html>
