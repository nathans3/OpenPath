<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400">
  <style>.w { font-family: "Avenir Next", "Nunito Sans", "Segoe UI", Arial, sans-serif; font-weight: 700; font-size: 200px; letter-spacing: -6px; }</style>
  <g transform="translate(20 20) scale(0.703)"><defs>
    <radialGradient id="orb" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#e9fffb"/>
      <stop offset="0.28" stop-color="#7fe0d2"/>
      <stop offset="0.62" stop-color="#5fb9e6"/>
      <stop offset="1" stop-color="#5a6fe8"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- the OpenPath circle -->
  <circle cx="256" cy="256" r="196" fill="url(#orb)"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <!-- the path: a few steps winding up to where you are going -->
  <path d="M168 360 C 196 300, 300 340, 262 262 C 236 210, 282 188, 302 184" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-dasharray="1 58" opacity=".95"/>
  <path d="M168 360 C 196 300, 300 340, 262 262 C 236 210, 282 188, 302 184" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity=".55"/>
  <!-- the destination: a bright dot in a ring, like OpenPath's pointer -->
  <circle cx="352" cy="170" r="40" fill="none" stroke="#ffffff" stroke-width="10" filter="url(#glow)"/>
  <circle cx="352" cy="170" r="17" fill="#ffffff"/>
</g>
  <text class="w" x="410" y="270"><tspan fill="#16202a">Open</tspan><tspan fill="#1f6f8b">Path</tspan></text>
</svg>
